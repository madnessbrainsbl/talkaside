<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes wave { 0%, 100% { transform: scaleY(.82) } 50% { transform: scaleY(1.08) } }
    @media (prefers-reduced-motion: no-preference) {
      line { transform-box: fill-box; transform-origin: center; animation: wave 2.2s ease-in-out infinite; }
      line:nth-child(2), line:nth-child(4) { animation-delay: -.55s; }
      line:nth-child(3) { animation-delay: -1.1s; }
    }
  </style>
  <g stroke="#5B8CFF" stroke-width="4.5" stroke-linecap="round">
    <line x1="10" y1="25" x2="10" y2="39"/>
    <line x1="21" y1="16" x2="21" y2="34"/>
    <line x1="32" y1="30" x2="32" y2="48"/>
    <line x1="43" y1="16" x2="43" y2="34"/>
    <line x1="54" y1="25" x2="54" y2="39"/>
  </g>
</svg>
